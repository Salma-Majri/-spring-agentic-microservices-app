server.port=8058
spring.application.name=ebank-chatbot
spring.cloud.config.enabled=false
spring.cloud.discovery.enabled=true
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.chat.options.model=gemini-3.5-flash-lite
spring.ai.http.client.read-timeout=60s
discord.intents.message-content=true
spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8056/mcp

spring.ai.mcp.client.streamable-http.connections.ebank.url=http://localhost:8057/mcp


discord.bot.token=${DISCORD_TOKEN}
discord.token=${DISCORD_TOKEN}